name: JOR Website Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Expose deploy secrets as job-level env so steps can detect whether
    # Vercel is configured and skip deploying when it is not. This keeps a
    # missing token from failing CI and prevents a half-configured deploy
    # from ever running against live infrastructure.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PUSHER_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ap2
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}

      # Deploy steps only run when a Vercel token is configured. Without it
      # they are skipped (not failed), so CI never blocks on missing secrets
      # and no live operation is disrupted by an unconfigured deploy.
      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        run: npx vercel --prod --token="$VERCEL_TOKEN"

      - name: Deploy Preview (PRs)
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != ''
        run: npx vercel --token="$VERCEL_TOKEN"

      - name: Vercel deploy skipped (no token configured)
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set — skipping Vercel deploy. Configure repository secrets to enable deploys."
